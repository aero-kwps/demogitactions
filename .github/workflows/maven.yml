name: Java CI with Maven and Allure Report

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          
      - name: Build and Test with Maven
        run: mvn clean test
        
      - name: Store Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results
          retention-days: 1

  deploy-report:
    # Run this job only for pushes to the main branch
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # Grant permissions to write to the gh-pages branch
      contents: write
      # Grant permissions to upload artifacts to GitHub Pages
      pages: write
      # Grant permissions to create a JWT for authentication
      id-token: write

    steps:
      - name: Download Allure results
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: allure-results

      - name: Generate Allure Report with History
        uses: allure-framework/allure-github-action@v1.6.0
        with:
          # The directory where the Allure report will be generated
          report_dir: allure-history
          # The directory where the raw Allure results are stored
          results_dir: allure-results

      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload Allure report to GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # The directory containing the report to be deployed
          path: 'allure-history'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Java CI with Maven and Allure Report

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Grant write permission to the GITHUB_TOKEN so it can push to the gh-report branch
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          
      - name: Build and Test with Maven
        run: mvn clean test
        
      - name: Generate Allure Report
        if: always()
        run: mvn allure:report
        
      - name: Deploy Allure Report to gh-report branch
        # This action automatically pushes the generated files to the target branch
        uses: peaceiris/actions-gh-pages@v4
        # We only want to push the report to the branch when code is pushed to main (not on PRs)
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-report
          publish_dir: target/site/allure-maven-plugin
